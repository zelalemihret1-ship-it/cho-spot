services:
  - type: web
    name: cho-spot-mini-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: RESTAURANT_NAME
        value: CHO SPOT
